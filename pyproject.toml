[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-session-exporter"
version = "0.2.0"
description = "Focused local exporter for Google Antigravity conversations"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
legacy-pb = ["cryptography>=41"]

[project.scripts]
antigravity-session-export = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "autostart",
    "cli",
    "content",
    "db",
    "exporter",
    "legacy_pb",
    "live",
    "selection",
    "version",
]
